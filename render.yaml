services:
  - type: web
    name: travelgenie-app
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
