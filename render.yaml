services:
  - type: web
    name: travelgenie-app
    runtime: node
    buildCommand: npm run install-all && npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

      # MongoDB
      - key: MONGODB_URI
        sync: false

      # Auth
      - key: JWT_SECRET
        generateValue: true

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false  # Set to: https://your-app.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        sync: false  # Set to: https://your-app.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false  # Set to: https://your-app.onrender.com

      # APIs
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: LOCATIONIQ_API_KEY
        sync: false
